    <script>
      // Fix for restricted sandboxed iFrame environment where window.fetch is getter-only.
      // This prevents Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Unable to define window.fetch hook:", e);
        }
      })();
    </script>

<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <title>مودرن هاوس للتجارة - جاري التحويل</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      try {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;

        // Check if this was an invoice route like /invoice/ORD-1001 or /verify-invoice/ORD-1001
        var match = path.match(/\/(?:invoice|verify-invoice)\/([^/?#]+)/i);
        if (match && match[1]) {
          var invoiceId = decodeURIComponent(match[1].trim());
          window.location.replace('/?invoice=' + encodeURIComponent(invoiceId));
          return;
        }

        // If search already contains invoice
        if (search.indexOf('invoice=') !== -1) {
          window.location.replace('/' + search);
          return;
        }

        // Fallback redirect to root SPA
        window.location.replace('/');
      } catch (e) {
        window.location.replace('/');
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(223, 177, 117, 0.2);
      border-top-color: #dfb175;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 20px; font-weight: 800; color: #dfb175; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>مودرن هاوس للتجارة</h2>
  <p>جاري تحويلك إلى الفاتورة الرقمية المعتمدة...</p>
</body>
</html>
